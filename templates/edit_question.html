
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Question - Quiz Application</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="dashboard-page">

    <header class="dashboard-header">
        <h2>📝 Quiz Application</h2>

        <a href="{{ url_for('view_questions') }}" class="logout-btn">
            View Questions
        </a>
    </header>

    <main class="dashboard-container">

        <section class="welcome-section">
            <h1>✏️ Edit Question</h1>
            <p>Update the question and its answer options.</p>
        </section>

        <form class="edit-question-form"
              method="POST"
              action="{{ url_for('edit_question', question_id=question.id) }}">

            {% if error %}
                <p class="empty-message">{{ error }}</p>
            {% endif %}

            <div class="form-group">
                <label for="question">Question</label>
                <textarea id="question" name="question"
                          required>{{ question.question }}</textarea>
            </div>

            <div class="options-grid">

                <div class="form-group">
                    <label for="option_a">Option A</label>
                    <input id="option_a" type="text" name="option_a"
                           value="{{ question.option_a }}" required>
                </div>

                <div class="form-group">
                    <label for="option_b">Option B</label>
                    <input id="option_b" type="text" name="option_b"
                           value="{{ question.option_b }}" required>
                </div>

                <div class="form-group">
                    <label for="option_c">Option C</label>
                    <input id="option_c" type="text" name="option_c"
                           value="{{ question.option_c }}" required>
                </div>

                <div class="form-group">
                    <label for="option_d">Option D</label>
                    <input id="option_d" type="text" name="option_d"
                           value="{{ question.option_d }}" required>
                </div>

            </div>

            <div class="form-group">
                <label for="correct_answer">Correct Answer</label>

                <select id="correct_answer" name="correct_answer" required>
                    <option value="A"
                        {% if question.correct_answer == "A" %}selected{% endif %}>
                        Option A
                    </option>

                    <option value="B"
                        {% if question.correct_answer == "B" %}selected{% endif %}>
                        Option B
                    </option>

                    <option value="C"
                        {% if question.correct_answer == "C" %}selected{% endif %}>
                        Option C
                    </option>

                    <option value="D"
                        {% if question.correct_answer == "D" %}selected{% endif %}>
                        Option D
                    </option>
                </select>
            </div>

            <div class="form-actions">
                <button type="submit" class="action-btn">
                    💾 Save Changes
                </button>

                <a href="{{ url_for('view_questions') }}"
                   class="action-btn">
                    Cancel
                </a>
            </div>

        </form>

    </main>

</body>
</html>
