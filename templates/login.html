
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Application - Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-page">

    <div class="login-container">
        <div class="logo">📝</div>

        <h1>Quiz Application</h1>
        <p class="tagline">Learn, Practice, and Test Your Knowledge!</p>

        <div class="login-card">
            <h2>Welcome Back!</h2>
            <p class="subtitle">Login to start your learning journey</p>

            <form action="{{ url_for('home') }}" method="POST">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

                <button type="submit">Login</button>
            </form>

            {% if error %}
                <p class="error-message">{{ error }}</p>
            {% endif %}

            <p class="login-footer">Every question is a chance to learn!</p>
        </div>
    </div>

</body>
</html>
